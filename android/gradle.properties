org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# La carpeta del proyecto lleva tilde ("Detalles-articulos" con i acentuada) y
# AGP lo rechaza por defecto. El aviso apunta a problemas con rutas nativas;
# aqui no hay NDK ni C++, solo Kotlin y recursos, y compila bien.
# Si algun dia se anade codigo nativo, habra que mover el proyecto a una ruta
# sin acentos en vez de subir la excepcion de nivel.
android.overridePathCheck=true

kotlin.code.style=official
